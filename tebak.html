<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tebak Angka | AbduDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --accent: #ffcc00;
      --box-bg: #111;
    }
    body.light {
      --bg: #fff;
      --text: #0842ee;
      --accent: #007bff;
      --box-bg: #f0f0f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .game-box {
      background: var(--box-bg);
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    input[type="number"] {
      padding: 0.5rem;
      border-radius: 8px;
      border: none;
      margin-top: 1rem;
      font-family: inherit;
      font-size: 1rem;
      text-align: center;
      width: 80%;
    }

    button {
      margin-top: 1rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .result {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      min-height: 40px;
    }

    .tries {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #aaa;
    }

    .back-button {
      margin-top: 2rem;
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--accent);
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()">🌓</div>

  <div class="game-box">
    <h1>Tebak Angka 1-10</h1>
    <p>Masukkan angka tebakan kamu:</p>
    <input type="number" id="guessInput" min="1" max="10" placeholder="1 - 10"/>
    <br>
    <button onclick="checkGuess()">Tebak!</button>
    <div class="result" id="resultText"></div>
    <div class="tries" id="triesLeft"></div>
    <a href="index.html" class="back-button">← Kembali ke Menu</a>
  </div>

  <script>
    let targetNumber = Math.floor(Math.random() * 10) + 1;
    let attempts = 3;

    function checkGuess() {
      const input = document.getElementById('guessInput');
      const result = document.getElementById('resultText');
      const triesText = document.getElementById('triesLeft');
      const guess = parseInt(input.value);

      if (isNaN(guess) || guess < 1 || guess > 10) {
        result.innerText = "Masukkan angka valid (1-10).";
        return;
      }

      if (guess === targetNumber) {
        result.innerHTML = "🎉 Selamat! Jawaban kamu benar!";
        input.disabled = true;
      } else {
        attempts--;
        if (attempts > 0) {
          result.innerText = `❌ Salah! Coba lagi.`;
          triesText.innerText = `Sisa percobaan: ${attempts}`;
        } else {
          result.innerHTML = `😢 Game Over! Angkanya adalah ${targetNumber}.`;
          input.disabled = true;
          triesText.innerText = "Coba refresh halaman untuk bermain lagi.";
        }
      }

      input.value = "";
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }
  </script>
</body>
</html>
