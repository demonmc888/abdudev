<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Match | AbduDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #111;
      --text: #fff;
      --card: #222;
      --accent: #00ffcc;
    }

    body.light {
      --bg: #fff;
      --text: #222;
      --card: #eee;
      --accent: #007bff;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--accent);
    }

    h1 {
      margin: 1rem 0 0.5rem;
      color: var(--accent);
      text-align: center;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 15px;
      margin-top: 1rem;
      padding: 1rem;
      justify-content: center;
    }

    .card {
      width: 80px;
      height: 80px;
      background-color: var(--card);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: transparent;
      cursor: pointer;
      transition: 0.3s;
      user-select: none;
    }

    .card.open,
    .card.matched {
      color: var(--text);
      background-color: var(--accent);
    }

    #moves {
      margin-top: 0.5rem;
      font-size: 1rem;
      text-align: center;
    }

    #result {
      font-size: 1.3rem;
      color: var(--accent);
      text-align: center;
      margin-top: 1rem;
    }

    .back-button {
      margin-top: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()">🌓</div>
  <h1>Memory Match</h1>
  <div id="moves">Langkah: 0</div>
  <div class="game-board" id="board"></div>
  <div id="result"></div>
  <a href="index.html" class="back-button">← Kembali ke Menu</a>

  <script>
    const board = document.getElementById("board");
    const movesText = document.getElementById("moves");
    const resultText = document.getElementById("result");
    const emojis = ["🍎", "🍌", "🍓", "🍇", "🍉", "🍍"];
    let cards = [];
    let firstCard = null;
    let secondCard = null;
    let moves = 0;
    let matched = 0;

    function shuffle(array) {
      return array.concat(array).sort(() => Math.random() - 0.5);
    }

    function createBoard() {
      cards = shuffle(emojis);
      board.innerHTML = '';
      moves = 0;
      matched = 0;
      movesText.textContent = "Langkah: 0";
      resultText.textContent = '';

      cards.forEach((emoji, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.emoji = emoji;
        card.dataset.index = index;
        card.textContent = emoji;

        card.addEventListener("click", () => {
          if (card.classList.contains("open") || card.classList.contains("matched")) return;
          if (firstCard && secondCard) return;

          card.classList.add("open");

          if (!firstCard) {
            firstCard = card;
          } else {
            secondCard = card;
            moves++;
            movesText.textContent = `Langkah: ${moves}`;

            if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
              firstCard.classList.add("matched");
              secondCard.classList.add("matched");
              firstCard = null;
              secondCard = null;
              matched++;
              if (matched === emojis.length) {
                resultText.textContent = "🎉 Selamat! Semua cocok!";
              }
            } else {
              setTimeout(() => {
                firstCard.classList.remove("open");
                secondCard.classList.remove("open");
                firstCard = null;
                secondCard = null;
              }, 800);
            }
          }
        });

        board.appendChild(card);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    createBoard();
  </script>
</body>
</html>
